name: CI

# Pull requests only. `main` is protected and can be reached solely through a
# PR whose branch must be up to date first, so a push-to-main run would re-test
# a tree this workflow has already passed. Tags are covered by `release.yml`,
# which runs the tests again before it packages anything.
on:
  pull_request:

# Git Bash ships on the Windows runners, so one set of steps serves all three
# platforms. Only installing MoonBit differs.
defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows runs and reports but does not block, because it currently cannot
    # get as far as running: `moon build --target native` fails with MSVC's
    # `C1026: parser stack overflow` on the Excel backend's formula dispatcher
    # — one ~4900-line function matching 365 names, which the compiler cannot
    # parse. It is code yxl never calls (formulas are Excel's to evaluate), it
    # is in a dependency, and there is no way round it from here: `clang-cl`
    # cannot be substituted (moon's Windows path fails to spawn its own
    # toolchain), and the LLVM target is closed off because the backend depends
    # on `moonbitlang/async`, which declares itself native-only.
    #
    # So Windows is **experimental** until the dependency splits that function.
    # Leaving the leg red and required would only train everyone to ignore a red
    # tick; leaving it out entirely would hide a platform going quietly stale.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Update registry index
        run: moon update

      - name: Type check (deny warnings)
        run: moon check --deny-warn

      - name: Format check
        run: moon fmt --check

      - name: Interface drift (.mbti)
        run: |
          moon info
          git diff --exit-code

      # `yxl version` reads a constant, which nothing else forces to match the
      # package metadata. Fail here rather than ship a binary that lies.
      - name: Version drift (moon.mod vs. the CLI constant)
        run: |
          declared=$(grep -E '^version = ' moon.mod | cut -d'"' -f2)
          reported=$(grep -E '^pub let version : String = ' src/cli/cli.mbt | cut -d'"' -f2)
          echo "moon.mod: $declared, cli: $reported"
          test "$declared" = "$reported"

      # The product target is native (ADR-003): the CLI reads/writes files on
      # disk. Build it before testing it — a compiler that cannot build the
      # binary is a worse fact than a failing test, and finding it second means
      # never finding it at all when the tests fail first.
      - name: Build CLI (native)
        run: moon build --target native --release

      # This is also where the scaling guardrail runs (src/cli/scaling_test.mbt):
      # it compiles one spec at two sizes and fails if the cost stops being
      # linear. It rides along here rather than in a step of its own because it
      # asserts on a *ratio* measured within a single run, which needs no
      # calibration per platform — so getting it on all three runners costs
      # nothing extra.
      - name: Test (native)
        run: moon test --target native

      # The other half of the performance item, and the half that does *not*
      # gate: the figures themselves. A hosted runner's absolute milliseconds
      # cannot be compared against a laptop's, so nothing here is asserted —
      # what it buys is that a PR touching the pipeline arrives with its parse /
      # load / emit split already measured, in the job summary, instead of
      # depending on a reviewer to run it. One platform is enough for that;
      # Linux is the cheapest of the three.
      - name: Benchmark (figures only, no threshold)
        if: runner.os == 'Linux'
        run: |
          moon bench src/cli --target native --release | tee bench.txt
          {
            echo '### Compile benchmark'
            echo
            echo 'Absolute times are this runner'"'"'s and are not comparable'
            echo 'across machines. The scaling guardrail in `moon test` is what'
            echo 'actually gates.'
            echo
            echo '```'
            cat bench.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # Tier 2 (ROADMAP §5). `moon test` already compiles the corpus in-process
      # and asserts on the cells; this runs the shipped binary over the same
      # files, which is what exercises the on-disk include/data path resolution
      # and the exit codes a user actually sees.
      - name: Examples compile with the built binary
        run: |
          yxl=_build/native/release/build/cmd/main/main.exe
          for spec in examples/*.yxl.yaml; do
            echo "--- $spec"
            "$yxl" build "$spec" --check
          done

      # The release archive is built by the same script `release.yml` uses, so
      # a packaging step that only works on some platforms fails here rather
      # than on a tag push, where it costs a release. Unpacking it and running
      # what comes out is also what checks the layout the installers expect.
      - name: Package (the release path, rehearsed)
        run: |
          .github/scripts/package.sh 0.0.0-ci "$RUNNER_OS"
          name="yxl-0.0.0-ci-$RUNNER_OS"

          sum=$(cut -d' ' -f1 <"$name".*.sha256)
          echo "$sum" | grep -Eq '^[0-9a-f]{64}$' ||
            { echo "the .sha256 does not start with a sha256: '$sum'"; exit 1; }

          mkdir yxl-unpacked
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command \
              "Expand-Archive -Path '$name.zip' -DestinationPath 'yxl-unpacked'"
            binary="yxl-unpacked/$name/yxl.exe"
          else
            tar xzf "$name.tar.gz" -C yxl-unpacked
            binary="yxl-unpacked/$name/yxl"
          fi
          test -f "$binary" || { echo "the archive has no $binary"; exit 1; }
          "$binary" version

      # Japanese Windows is a first-class case, and there are two halves to it.
      # This is the half yxl controls: a `\` separator (which that console draws
      # as ¥) and CP932 names like 表, ソ and 十, whose second byte is 0x5C — a
      # byte-wise split would cut such a name in half. The paths that matter come
      # from *file contents*, which are UTF-8 all the way through.
      #
      # The other half is the command line itself, which cannot carry non-ASCII
      # on Windows today: `moonbitlang/x/sys` reads argv as UTF-8 ("TODO: Handle
      # other encodings"), while Windows hands it over in the ANSI code page. So
      # the spec is named in ASCII here and reached by backslash; the Japanese
      # paths live inside it.
      - name: Japanese paths and backslashes (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "表ソ十\見積¥1000" | Out-Null
          Copy-Item -Recurse examples\modular "表ソ十\見積¥1000\modular"
          New-Item -ItemType Directory -Force -Path specs | Out-Null
          @'
          defs:
            styles:
              $include: ../表ソ十/見積¥1000/modular/theme.yaml
          sheets:
            - name: 売上
              data:
                - at: A1
                  csv: ../表ソ十/見積¥1000/modular/sales.csv
          '@ | Set-Content -Path "specs\report.yxl.yaml" -Encoding utf8
          $yxl = "_build\native\release\build\cmd\main\main.exe"
          & $yxl build specs\report.yxl.yaml -o out.xlsx
          Get-Item out.xlsx | Format-List Name, Length
