name: Release

# A release is a deliberate act, so pushing a tag triggers it — merging a PR
# only runs CI. The tag is the version: `v0.1.0` publishes 0.1.0, and the first
# job refuses to build if the tag, `moon.mod`, and the version the CLI reports
# disagree.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release and upload its assets

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag, moon.mod, and `yxl version` agree
        env:
          # Through the environment rather than inline, so the tag is data.
          TAG: ${{ github.ref_name }}
        run: |
          tagged=${TAG#v}
          declared=$(grep -E '^version = ' moon.mod | cut -d'"' -f2)
          reported=$(grep -E '^pub let version : String = ' src/cli/cli.mbt | cut -d'"' -f2)
          echo "tag: $tagged, moon.mod: $declared, cli: $reported"
          test "$tagged" = "$declared"
          test "$tagged" = "$reported"

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest # Apple silicon
            target: macos-arm64
          - os: windows-latest
            target: windows-x86_64
          # No Intel macOS build: the free `macos-13` runner is retired, and its
          # successors (`macos-15-intel` / `-large`) are larger runners whose
          # billing was not confirmed. Intel Macs build from source — an arm64
          # binary cannot run there, so shipping one would be worse than none.
    runs-on: ${{ matrix.os }}
    # Windows is experimental and does not block a release: the binary cannot be
    # built there today (see ci.yml for why), so a tag ships Linux and macOS and
    # the Windows asset is simply absent. `install.ps1` says so when it cannot
    # find one, which is better than a release that never happens.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    # Git Bash ships on the Windows runners, so packaging is one script for all
    # three platforms; only the installer and the archive format differ.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Update registry index
        run: moon update

      # The binary is the product; a release that fails its own tests is worse
      # than no release.
      - name: Test (native)
        run: moon test --target native

      - name: Build (native, release)
        run: moon build --target native --release

      # Shared with CI, which runs it on every pull request so this path is
      # never first exercised by a tag push.
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: .github/scripts/package.sh "${TAG#v}" "$TARGET"

      - uses: actions/upload-artifact@v7
        with:
          name: yxl-${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # `gh` ships on the runner, so the release needs no third-party action.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            artifacts/*
