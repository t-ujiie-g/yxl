# Part of the validity corpus (ROADMAP §5).
#
# a conditional format whose style carries a number format and an alignment,
# which is the combination that puts `<dxf>`'s children out of CT_Dxf order
#
# This is not the cookbook. `examples/` is written to be read and teaches one
# thing at a time; this is written to be *validated*, and reaches for every
# variant the schema offers — because the Open XML validator only ever judges
# the files something actually produces. Three icon sets shipped invalid for
# two phases because the cookbook happened to use one of the twenty.
#
# Nothing here needs to be legible or realistic. Add a row when the schema
# grows a variant; never delete one to make a build pass.
#
# A `<dxf>` holding only a font and a fill is in CT_Dxf order by accident, which
# is all `conditional.yxl.yaml` builds; this one pins the order with a number
# format and an alignment in it (office.mbt#531, fixed in mbtexcel 0.3.0).

defs:
  styles:
    # A base style of the kind a spec shares across a workbook. Inheriting it
    # into a conditional style is how an author hits this without ever writing
    # `align:` on the rule.
    base:
      align: { vertical: middle }
    hit:
      extends: base
      font: { bold: true }
      format: "0.0"
      fill: FFF2CC
      border: thin

sheets:
  - name: Rules
    cells:
      A1: 1
      A2: 2
    conditional:
      - at: A1:A10
        formula: "TRUE"
        style: hit
