# Part of the validity corpus (ROADMAP §5).
#
# everything that decorates a cell rather than filling it: every validation
# comparison, all three error styles, both link forms, notes with and
# without an author, merges, an auto filter, and all three sparkline types
#
# This is not the cookbook. `examples/` is written to be read and teaches one
# thing at a time; this is written to be *validated*, and reaches for every
# variant the schema offers — because the Open XML validator only ever judges
# the files something actually produces. Three icon sets shipped invalid for
# two phases because the cookbook happened to use one of the twenty.
#
# Nothing here needs to be legible or realistic. Add a row when the schema
# grows a variant; never delete one to make a build pass.

sheets:
  - name: Deco
    cells:
      A1: Code
      B1: Status
      C1: Qty
      D1: Amount
      E1: Len
      F1: When
      A2: X1
      B2: Draft
      C2: 3
      D2: 1.5
      E2: abc
      F2: { value: "2026-08-09", type: date }
    validations:
      - at: B2:B200
        list: [Draft, Sent, Paid]
      - at: B2:B200
        list: { from: "Lookup!A1:A3" }
        allow_blank: false
        prompt: { title: Status, body: "Pick one." }
        error: { title: "no", body: "pick", style: warning }
      - at: C2:C200
        whole: { between: [1, 1000] }
        error: { title: "no", body: "pick", style: information }
      - at: C2:C200
        whole: { not_between: [1, 10] }
      - at: C2:C200
        whole: { equals: 5 }
      - at: C2:C200
        whole: { not_equals: 5 }
      - at: D2:D200
        decimal: { at_least: 0 }
      - at: D2:D200
        decimal: { at_most: 99.5 }
      - at: D2:D200
        decimal: { greater_than: 0 }
      - at: D2:D200
        decimal: { less_than: 100 }
      - at: E2:E200
        text_length: { at_most: 12 }
      - at: F2:F200
        date: { at_least: "2026-01-01" }
      - at: F2:F200
        date: { between: ["2026-01-01", "2026-12-31"] }
    links:
      A2: https://example.com/orders/1001
      B1: { to: "Lookup!A1", tip: "The statuses" }
      C1: { url: "https://example.com", tip: "The dashboard" }
    comments:
      C2: "Bulk order — check stock."
      B1: { text: "Sourced from Lookup.", author: Finance }
    merges: [A10:C10, A12:A14]
    filter: A1:F1
  - name: Lookup
    cells:
      A1: Draft
      A2: Sent
      A3: Paid
      B1: 10
      B2: 20
      B3: 30
    sparklines:
      - at: C1
        data: B1:B3
        markers: true
        high: true
        low: true
        color: "1F77B4"
        weight: 1.5
        colors: { markers: "FF0000", high: "00FF00", low: "0000FF" }
      - cells:
          - { at: C2, data: B1:B3 }
          - { at: C3, data: Deco!C2:D2 }
        type: win_loss
        axis: true
      - at: C4
        data: B1:B3
        type: column
        min: 0
        max: 40
