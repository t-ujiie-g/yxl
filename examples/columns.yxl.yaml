# Columns addressed by name rather than by letter. Build it with:
#
#   yxl build examples/columns.yxl.yaml -o columns.xlsx
#
# A year-on-year report: this year, last year, and the ratio, for sales and for
# gross profit. Written with `columns:`, `formulas:` and `conditional:`, every
# entry would carry a letter, and inserting a column would rewrite all of them.
# Here the only letter is the layout's `at:`; the columns follow in order, and
# the three columns that repeat per item are written once, as a block.

defs:
  styles:
    header:
      font: { bold: true, color: "FFFFFF" }
      fill: "1F3864"
      align: { horizontal: center }
    fall:
      font: { color: "9C0006" }
  blocks:
    # This year, last year, and the ratio: one definition, so the formula, the
    # formats and the rule cannot drift apart between items. `{{cy}}` is this
    # row's cell of the instance's own `cy`, never a letter.
    yoy:
      columns:
        - { name: cy, header: 当年, width: 12, format: "#,##0" }
        - { name: py, header: 前年, width: 12, format: "#,##0" }
        - name: ratio
          header: 前年比
          width: 10
          format: "0.0%"
          formula: 'IFERROR({{cy}}/{{py}}-1,"")'
          conditional:
            - { cell: { less_than: 0 }, style: fall }

sheets:
  - name: 実績
    freeze: B4
    cells:
      A1: 2026年度 上期 前年比
    layouts:
      - at: A2
        header_style: header
        # The rows fill the columns without a formula, in order, so no row
        # holds a placeholder for a ratio. The body is as long as the rows.
        values:
          - [東日本, 5200000, 4800000, 1560000, 1500000]
          - [西日本, 4100000, 4300000, 1150000, 1240000]
          - [九州, 1900000, 1700000, 610000, 540000]
          - [海外, 2600000, 2100000, 700000, 690000]
        columns:
          - { name: item, header: 部門, width: 16 }
          # Each instance's `header` sits above the block's own headers and
          # merges across its three columns. Its columns are `sales.cy` and so
          # on. Adding an item is one more line here.
          - { block: yoy, as: sales, header: 売上 }
          - { block: yoy, as: gross, header: 粗利 }
        footer:
          - row:
              item: 合計
              sales.cy: { total: sum }
              sales.py: { total: sum }
              sales.ratio: { formula: 'IFERROR({{sales.cy}}/{{sales.py}}-1,"")' }
              gross.cy: { total: sum }
              gross.py: { total: sum }
              gross.ratio: { formula: 'IFERROR({{gross.cy}}/{{gross.py}}-1,"")' }
            style: header
