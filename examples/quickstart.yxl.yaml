# The smallest useful spec: cells of each kind, and a formula Excel computes on
# open. Build it with:
#
#   yxl build examples/quickstart.yxl.yaml -o quickstart.xlsx
#
sheets:
  - name: Sales
    cells:
      # A bare scalar is the cell's value; YAML's own types carry over, so
      # `Region` is text, `2400000` a number, and `true` a boolean.
      A1: Region
      B1: Revenue
      C1: Commission
      A2: APAC
      B2: 2400000
      A3: EMEA
      B3: 1750000

      # A quoted number stays text — useful for codes with leading zeros.
      A4: "007"

      # The expanded form adds a number format, a style, or a type.
      B4: { value: 0.085, format: "0.0%" }

      # yxl emits formulas; Excel evaluates them. `value:` is the cached result
      # shown until it does.
      A5: Total
      B5: { formula: "SUM(B2:B3)", value: 4150000 }

      # An elapsed time, not a time of day: `type: duration` stores a fraction
      # of a day under an `[h]` format, so the hours keep counting past 24.
      A6: Hours logged
      B6: { value: "36:00:00", type: duration }

    # A calculation column: one formula that moves. It is written as it applies
    # at the range's top-left cell, so C3 gets `B3*0.05` without being spelled
    # out — and adding a region means editing the range, not pasting a line.
    # This compiles to Excel's own shared formula: one stored formula, not one
    # per row.
    formulas:
      - at: C2:C3
        formula: "B2*0.05"

    # A block of rows that belong together reads better as an anchored table
    # than as one `cells:` key per address. `cells:` is keyed by address, so
    # inserting a row rewrites every key below it and `git diff` shows the whole
    # block; here only the inserted line moves. Fields keep YAML's types, same
    # as above. Swap `values:` for `csv:` and the rows come from a file instead.
    data:
      - at: A9
        values:
          - [Quarter, Bookings]
          - [Q1, 980000]
          - [Q2, 1120000]
          - [Q3, 1300000]
