# The month's transactions. The rows arrive as a CSV named by the `month`
# parameter, so a refresh swaps a file and a flag rather than editing the sheet.
# The body is as long as the file: no row count to keep in step.
name: Sales
freeze: A2
layouts:
  - at: A1
    name: sales
    header_style: header
    csv: "workbook/data/sales-${month}.csv"
    columns:
      - { name: store_code, header: store_code, width: 12 }
      - { name: amount, header: amount, width: 14, style: money }
      # A derived column: one shared formula down the body, reading the master
      # by name, so it does not care where that sheet is or how long it grows.
      - name: store_name
        header: store_name
        width: 18
        formula: 'IFERROR(INDEX(stores.name, MATCH({{store_code}}, stores.code, 0)), "")'
# The layout declared an Excel table: filter buttons, banding, a name.
tables:
  - { at: sales, name: SalesEntries, style: TableStyleMedium2 }
validations:
  # The drop-down's choices are the master's own column, so it can never offer
  # a code the master does not have, however many stores it holds.
  - at: sales.store_code
    list: { from: stores.code }
    error: { title: Unknown store, body: "Pick a code from the store master." }
