# The page a reader opens. It takes one row per store from the master's file —
# only the code, the key a row is about — and computes everything else: the
# name from the master, the figures from the month's transactions.
name: Summary
freeze: A4
merges: [A1:D1]
cells:
  A1: { value: "Store revenue — ${month}", style: title }
layouts:
  - at: A3
    name: summary
    header_style: header
    csv: workbook/masters/stores.csv
    columns:
      - name: store
        header: Store
        width: 20
        formula: 'IFERROR(INDEX(stores.name, MATCH({{code}}, stores.code, 0)), "")'
      - name: revenue
        header: Revenue
        width: 14
        style: money
        formula: "SUMIFS(sales.amount, sales.store_code, {{code}})"
        conditional:
          - { cell: { at_least: 2000000 }, style: on_target }
      - name: share
        header: Share
        width: 10
        style: percent
        formula: 'IFERROR({{revenue}}/SUM(summary.revenue), "")'
      - name: against
        header: Against target
        width: 14
        formula: 'IF({{revenue}}>=target_revenue, "on target", "below")'
      # The key the revenue column looks up by; kept, but out of the reader's way.
      - { name: code, header: Code, hidden: true }
    # The totals sit under however many stores there are, and the target note
    # under them.
    footer:
      - row: { store: Total, revenue: { total: sum } }
        style: total
      - row: { store: Target per store, revenue: { formula: "target_revenue" } }
        style: note
