# The store list, held once for the whole workbook. Naming the layout makes each
# column a defined name — `stores.code`, `stores.name` — so every other sheet
# reaches the list by name, and no sheet carries a second copy to drift.
name: Masters
# Plumbing rather than a page to read. `hidden` is undoable from Excel's UI;
# `very_hidden` would need VBA.
visibility: hidden
layouts:
  - at: A1
    name: stores
    header_style: header
    # A `data:` or layout path resolves against the spec `yxl build` was given,
    # *not* against this file, so it reads the same from wherever it is included.
    # The CSV's header row names the fields; the columns take them by name.
    csv: workbook/masters/stores.csv
    columns:
      - { name: code, header: store_code, width: 12 }
      - { name: name, header: store_name, width: 18 }
      - { name: region, header: region, width: 12 }
