# The shape a workbook that has to be maintained should take: this file names
# the parts and holds nothing else. One file per sheet, the look declared in one
# place, every table a layout whose rows come from a CSV, the store list held
# once and reached by name from everywhere, and the month's numbers in a CSV
# the source system writes.
#
#   yxl build examples/workbook.yxl.yaml
#   yxl build examples/workbook.yxl.yaml --set month=2026-08
#
# Next month is that second line: drop `workbook/data/sales-2026-09.csv` beside
# its siblings and set `month`. Nothing else moves — not even the file name,
# which `output` takes from the month: `workbook/out/store-revenue-2026-08.xlsx`.
output: workbook/out/store-revenue-${month}.xlsx

params:
  month: "2026-07"

defs:
  $include: workbook/defs.yaml

# Written order is tab order.
sheets:
  - $include: workbook/sheets/summary.yaml
  - $include: workbook/sheets/sales.yaml
  - $include: workbook/sheets/masters.yaml
